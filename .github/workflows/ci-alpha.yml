# Alpha-tier required workflow, BHoM variant. Sourced by the organisation ruleset's
# `workflows` rule; it is not copied into consuming repositories.
#
# Carries the compliance and build checks only. ci-serialisation and
# ci-versioning are deliberately absent while they are reworked, and remain in
# each repository's own ci-<tier>.yml so they keep running non-blocking.
# ci-dataset-compliance and ci-dataset-tests are absent because both fail on
# untouched input and must not gate a merge.
#
# Job names are the check contexts. Keep the ci- prefix: the bare names collide
# with BHoMBot's required contexts on repositories whose protection is unpinned.

name: CI

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  ci-build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Run build
        uses: BHoM/CI_Toolkit/.github/actions/ci-build@develop
        with:
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}

  ci-copyright-compliance:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Run copyright compliance
        uses: BHoM/CI_Toolkit/.github/actions/ci-compliance@develop
        with:
          check_type: copyright
          patterns: '*.cs'
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}

  ci-project-compliance:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Run project compliance
        uses: BHoM/CI_Toolkit/.github/actions/ci-compliance@develop
        with:
          check_type: project
          patterns: '*AssemblyInfo.cs *.csproj'
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
