# Thin caller for the release-readiness cross-build. Public host: the
# subject org derives from this repo's owner (BHoM) inside the reusable, so
# nothing org-specific is passed. No upstream cohort: BHoM subjects depend
# only on the BHoM cohort. All logic lives in the Admin reusable.
name: Release Readiness (BHoM)

on:
  # SCHEDULE DISABLED 2026-08-10, pending a decision on whether this workflow is kept.
  #
  # Evidence: over five runs (2026-07-17 to 08-10) the compile dimension produced no
  # genuine coupling finding. The same legs failed every week (19 of 38 on BHE,
  # unchanged) and the cause was environmental, not coupling: dependencies fail at
  # their own release tags with MSB3822/MSB3823, the old-style-.csproj-with-binary-
  # resources failure under SDK `dotnet build`. BHoMBot's nightly alpha builds the
  # same repos green because it uses full MSBuild (BuildSolution.cs:56 via
  # BuilderPath.cs). The CS0234/CS0246 errors in dependent legs are cascades from
  # that, not findings. The versioning legs were separately 100% misattributed (see
  # CI_Toolkit#150). Neither rolling issue was ever read: 0 comments, 0 assignees in
  # 24 days.
  #
  # The question this workflow asks has a referent, but a very rare one. It asks
  # whether a subject can be released against the shipped cohort. Swept 2026-08-11
  # across all 80 beta repos in both orgs, 1,562 tags: exactly four carry a non-.0
  # patch component, and only one is recent.
  #
  #   BHoM/ETABS_Toolkit             v2.4.beta.1   2019-10-04
  #   BHoM/BHoM_UI                   v3.2.beta.1   2020-06-30
  #   BHoM/Grasshopper_UI            v4.1.beta.1   2021-03-30
  #   BHE/Revit_Documentation_Tool   v7.0.beta.1   2024-01-08
  #
  # Every repo currently sits at v9.2.beta.0, tagged in one ceremony, and the fleet
  # ships as one MSI built from those tags (BuildBeta.cs:49), which is why BHoMBot's
  # beta-installer / beta-versioning never went red: 142 observations across 14 repos
  # over five quarterly cycles, zero non-success.
  #
  # CORRECTION 2026-08-11: an earlier version of this note claimed there had never
  # been a patch release, measured on 10 BHoM repos only. The sweep above disproves
  # it. The decision below rests on rarity and zero yield, not on the absence of a
  # referent.
  #
  # DEPRECATED 2026-08-11. The schedule is the only trigger that ever fired it and it
  # is disabled, so this workflow no longer runs on its own. Nothing is deleted:
  # workflow, caller and rolling issues are retained as a record. CI_Toolkit#150 and
  # #153 are closed as moot, since they only ever gated a re-enable.
  #
  # REVIVAL TRIGGER: a NEW non-.0 beta tag cut after 2026-08-11. The four above are
  # historical and do not count; the trigger is that the release model becomes
  # patch-based again, not that it ever was. Revive then, but fix the attribution
  # defect (whole-closure instead of subject-scoped, see CI_Toolkit#150) and the
  # MSBuild toolchain first, or every leg stays red for reasons unrelated to coupling.
  #
  # workflow_dispatch below still works, but a manual run currently returns
  # Error/~443 from the attribution defect above, not a coupling answer.
  #
  # schedule:
  #   - cron: '0 4 * * 1'   # was: weekly Monday 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Resolve + render only; no build.
        type: boolean
        default: false

concurrency:
  group: release-readiness-bhom
  cancel-in-progress: false

jobs:
  run:
    uses: BuroHappoldEngineeringAdmin/CI_Toolkit/.github/workflows/release-readiness-cross-build.yml@develop
    with:
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      BHOM_APP_ID:          ${{ secrets.BHOM_APP_ID }}
      BHOM_APP_PRIVATE_KEY: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
